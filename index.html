<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Transcribe Veeno AI with a lightweight handwritten-notes prompt helper.">
  <title>Transcribe Veeno AI — Online Video to Text</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">AI</div>
      <div class="brand-copy">
        <div class="brand-title">Transcribe <span class="veeno-highlight">Veeno ai</span></div>
        <div class="brand-subtitle">Video → Text</div>
      </div>
    </div>

    <div class="header-actions">
      <!-- Handwritten Notes appears ONLY here -->
      <div class="notes-control">
        <span class="notes-label">Handwritten Notes</span>

        <div class="prompt-anchor" id="promptAnchor">
          <span class="wave wave-1"></span>
          <span class="wave wave-2"></span>
          <span class="wave wave-3"></span>

          <button class="prompt-button" id="promptButton" type="button" aria-expanded="false">
            Prompt <span class="arrow">⌄</span>
          </button>

          <div class="language-menu" id="languageMenu">
            <button type="button" data-lang="roman">Roman Urdu</button>
            <button type="button" data-lang="urdu">Urdu</button>
            <button type="button" data-lang="english">English</button>
            <button type="button" data-lang="hindi">Hindi</button>
          </div>
        </div>
      </div>

      <div class="status-pill"><span></span> Online</div>
    </div>

    <!-- Overlay prompt editor: does NOT take page space -->
    <section class="prompt-popover" id="promptPopover" aria-label="Prompt generator" hidden>
      <div class="popover-head">
        <div>
          <small>SELECTED LANGUAGE</small>
          <strong id="activeLanguageLabel">Roman Urdu</strong>
        </div>
        <button class="close-popover" id="closePopover" type="button" aria-label="Close">×</button>
      </div>

      <label for="sourceText">Write topic or paste your text here</label>
      <textarea id="sourceText" placeholder="Paste your transcript, lecture text, article, or notes here..."></textarea>

      <div class="prompt-actions">
        <span id="textCount">0 characters</span>
        <button id="generateButton" class="generate-button" type="button" disabled>Generate Prompt</button>
      </div>

      <div class="parts-list" id="partsList"></div>
    </section>
  </header>

  <main class="page-shell">
    <!-- Compact line only: no hero, no extra block -->
    <section class="tool-intro">
      <span class="intro-badge">✦ AI VIDEO TRANSCRIBER</span>
      <strong>Transcribe your video to text</strong>
      <span>Paste a video link or upload your file below.</span>
    </section>

    <div class="layout">
      <section class="tool-column">
        <div class="tool-card">
          <div class="tool-card-top">
            <div class="mini-icon">▤</div>
            <div class="tool-title">
              <strong>Online Transcription Tool</strong>
              <small>Powered by Transcribe <span class="veeno-highlight veeno-inline">Veeno AI</span></small>
            </div>
            <div class="secure-pill">🔒 Secure</div>
          </div>

          <div class="iframe-wrap">
            <iframe
              src="https://transcribe-video.ai/"
              title="Transcribe Video AI"
              loading="eager"
              allow="clipboard-read; clipboard-write; microphone; camera"
              referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
          </div>
        </div>

      </section>

    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
